<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W001 Review Hub</title><link rel="stylesheet" href="styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><header class="topbar"><div><div class="eyebrow">W001 · WRITING FOUNDATIONS</div><h1>Review Hub</h1><p>Cycle 1 proof of concept · 10 daily retrieval quizzes</p></div><span class="badge">TEACHER HUB</span></header><main class="shell"><section class="card intro"><div><h2>Choose today’s review</h2><p>Each quiz is designed for about 10 minutes at the start of class. Students need no account.</p></div><div class="legend"><span><b>10</b> quizzes</span><span><b>10</b> items each</span><span><b>0</b> logins</span></div></section><section id="quizGrid" class="quiz-grid"></section></main><div id="qrModal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><div class="eyebrow">DISPLAY FOR STUDENTS</div><h2 id="qrTitle"></h2><div id="qrcode"></div><p id="qrUrl" class="small-url"></p><div class="actions"><a id="openStudent" class="primary-btn" target="_blank">Open student quiz</a><button id="copyUrl" class="secondary-btn">Copy URL</button></div></div></div><script src="quizzes.js"></script><script>const grid=document.getElementById('quizGrid'),modal=document.getElementById('qrModal'),qr=document.getElementById('qrcode');const studentUrl=id=>new URL(`quiz.html?id=${id}`,location.href).href;QUIZZES.forEach(q=>{const c=document.createElement('article');c.className='quiz-card';c.innerHTML=`<div class="dayline"><span>WEEK ${q.week}</span><strong>${q.day}</strong></div><h3>${q.title}</h3><p>${q.reviews}</p><div class="meta"><span>${q.questions.length} questions</span><span>≈10 min</span></div><div class="actions"><button class="primary-btn qrBtn">Display QR</button><a class="secondary-btn" href="quiz.html?id=${q.id}" target="_blank">Preview quiz</a></div>`;c.querySelector('.qrBtn').onclick=()=>{const u=studentUrl(q.id);document.getElementById('qrTitle').textContent=q.title;document.getElementById('qrUrl').textContent=u;document.getElementById('openStudent').href=u;qr.innerHTML='';new QRCode(qr,{text:u,width:260,height:260});modal.classList.remove('hidden')};grid.appendChild(c)});document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');modal.onclick=e=>{if(e.target===modal)modal.classList.add('hidden')};document.getElementById('copyUrl').onclick=()=>navigator.clipboard.writeText(document.getElementById('qrUrl').textContent);</script></body></html>
